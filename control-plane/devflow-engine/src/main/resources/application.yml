spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/devflow
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: devflow_app
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: devflow_app
    schemas: devflow_app

temporal:
  target: localhost:7233

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
